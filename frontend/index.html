<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AskPolicy is an AI assistant that answers questions using your company's indexed policy documents."
    />
    <meta name="theme-color" content="#faf9f6" />
    <title>AskPolicy — Company Policy Assistant</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong
      // theme. Falls back to the operating system preference on first visit.
      ;(function () {
        try {
          var stored = localStorage.getItem('askpolicy-theme')
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
          }
        } catch {
          /* Ignore storage access issues. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
